# Example Apache vhost for Xoomplus on cPanel / dedicated server.
# Astro Node standalone behind reverse proxy; static files from dist/client.
#
# Prerequisites:
#   - Node 22.x, app built with: npm ci && npm run build
#   - Process running: HOST=127.0.0.1 PORT=4321 npm start
#     (systemd, PM2, or cPanel "Setup Node.js App")
#   - Enable: proxy, proxy_http, headers, expires, deflate (as available)
#
# Env (set for the Node process — not WordPress):
#   SITE_URL=https://www.example.com          # public Astro origin
#   WP_BASE_URL=https://cms.example.com       # WordPress origin
#   PUBLIC_WP_API=https://cms.example.com/wp-json/wp/v2
#   REVALIDATE_SECRET=...                     # WP webhook header
#   HTML_CACHE_DIR=/home/USER/tmp/xoomplus-html-cache
#   HOST=127.0.0.1
#   PORT=4321
#
# After deploy: SITE_URL=https://www.example.com npm run warm:cache

<VirtualHost *:80>
	ServerName www.example.com
	ServerAlias example.com

	# Prefer SSL vhost in production; this block illustrates proxy + static layout.
	DocumentRoot /home/USER/apps/xoomplus/dist/client

	<Directory /home/USER/apps/xoomplus/dist/client>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Serve fingerprinted / static assets directly from disk (fast path).
	ProxyPass /.well-known !
	ProxyPass /_astro !
	ProxyPass /images !
	ProxyPass /videos !
	ProxyPass /fonts !
	ProxyPass /icons !
	ProxyPass /favicon.ico !
	ProxyPass /favicon.svg !
	ProxyPass /robots.txt !

	# Everything else (SSR HTML + /api/*) → Node
	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https" early
	ProxyPass / http://127.0.0.1:4321/
	ProxyPassReverse / http://127.0.0.1:4321/

	ErrorLog ${APACHE_LOG_DIR}/xoomplus-error.log
	CustomLog ${APACHE_LOG_DIR}/xoomplus-access.log combined
</VirtualHost>

# --- cPanel / Passenger note ---
# If using "Setup Node.js App" instead of ProxyPass:
#   Application root: /home/USER/apps/xoomplus
#   Application startup file: dist/server/entry.mjs  (confirm after `npm run build`)
#   Passenger will run the Astro Node entry; DocumentRoot can still point at dist/client
#   for assets, or let Node serve them. Prefer ProxyPass layout above when possible.
