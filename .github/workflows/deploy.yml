# Build Astro SSR and FTP to cPanel for Setup Node.js App (no Docker).
# Required secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Recommended secrets (build-time): SITE_URL, WP_BASE_URL, PUBLIC_WP_API
name: Deploy Astro SSR to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install & build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          PUBLIC_WP_API: ${{ secrets.PUBLIC_WP_API }}
          # Ensure Node adapter (middleware), not Vercel
          VERCEL: ''
          # Don't fail the deploy if CMS page IDs are temporarily unreachable
          SKIP_WP_ROUTE_CHECK: '1'
        run: |
          npm ci
          npm run build

      - name: Stage deploy bundle
        run: |
          mkdir -p deploy-bundle
          cp -r dist deploy-bundle/dist
          cp package.json package-lock.json server.js deploy-bundle/

      - name: FTP upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-bundle/
          server-dir: /public_html/
          dangerous-clean-slate: false
