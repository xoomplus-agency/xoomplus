# Mobile Lighthouse budgets on every PR / push to main.
# Requires secrets when SSR pages need WordPress: WP_BASE_URL, SITE_URL (optional LHCI_BLOG_POST).
name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guardrail — no static GSAP imports
        run: npm run check:no-gsap
      - name: Build
        env:
          SKIP_WP_ROUTE_CHECK: '1'
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PUBLIC_WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
        run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 &
          npx --yes wait-on http://127.0.0.1:4321/ --timeout 120000
      - name: Lighthouse CI
        env:
          LHCI_URL: http://127.0.0.1:4321
          LHCI_BLOG_POST: ${{ secrets.LHCI_BLOG_POST }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run lhci
